name: stt_demo
description: Internal demo app for testing and comparing Slovak speech-to-text models.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

# Versions are the latest on pub.dev as of 2026-11-12.
dependencies:
  flutter:
    sdk: flutter
  sherpa_onnx: ^2.0.1        # offline STT (Whisper, NeMo transducer) + Silero VAD
  record: ^7.2.0             # 16 kHz mono PCM16 microphone stream
  path_provider: ^2.1.6
  http: ^1.6.0
  shared_preferences: ^2.5.6
  provider: ^6.1.5
  file_picker: ^13.3.3       # import a test-set zip
  share_plus: ^13.3.1        # export CSV / JSON
  device_info_plus: ^13.3.0
  archive: ^4.6.0            # unzip test sets
  crypto: ^3.0.6             # verify model downloads

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models.json
